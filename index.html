<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EatFinder | 周遭營業中餐飲店家搜尋</title>
  <meta name="description" content="自動抓取目前 GPS 位置，搜尋周遭營業中的餐廳、小吃、咖啡廳與美食店家，提供 Google Maps 導航連結與今日營業時間。">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- 頂部導航欄 -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">🍜</div>
      <div class="brand-text">
        <h1>EatFinder</h1>
        <div class="tagline">周遭營業中美食探索</div>
      </div>
    </div>

    <div class="header-actions">
      <!-- 位置顯示（桌面顯示） -->
      <div class="location-pill" title="目前定位位置">
        <span class="loc-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
        <span class="loc-text" id="currentLocationText">正在獲取 GPS 定位...</span>
      </div>

      <button id="btnLocateMe" class="btn-header-action btn-primary" title="重新透過 GPS 偵測目前位置">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line></svg>
        <span class="btn-text-desktop">重新定位</span>
      </button>

      <button id="btnCustomLocation" class="btn-header-action" title="手動設定搜尋位置">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span class="btn-text-desktop">自訂位置</span>
      </button>

      <button id="btnFavoritesToggle" class="btn-header-action btn-fav-toggle" title="查看收藏的店家">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span class="btn-text-desktop">收藏</span>
      </button>
    </div>
  </header>

  <!-- 主應用區域 -->
  <main class="app-container">

    <!-- 手機版 Tab 切換導覽列 -->
    <nav class="mobile-tab-bar" aria-label="頁面切換">
      <button class="tab-btn active" id="tabList" data-tab="list">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        <span>店家清單</span>
        <span class="tab-count-badge" id="tabCountBadge"></span>
      </button>
      <button class="tab-btn" id="tabMap" data-tab="map">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        <span>地圖</span>
      </button>
    </nav>

    <!-- 側邊欄店家列表 -->
    <aside class="sidebar" id="panelList">

      <!-- 篩選控制面板 -->
      <section class="filter-panel" aria-label="搜尋與篩選">
        <!-- 關鍵字輸入 -->
        <div class="search-input-wrapper">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchKeywords" class="search-input" placeholder="搜尋店名、拉麵、火鍋、咖啡..." aria-label="搜尋關鍵字">
        </div>

        <!-- 篩選橫列（可橫向捲動） -->
        <div class="filter-chips-row">
          <select id="searchRadius" class="chip-select" aria-label="搜尋半徑">
            <option value="1">📍 1 公里</option>
            <option value="3" selected>📍 3 公里</option>
            <option value="5">📍 5 公里</option>
            <option value="10">📍 10 公里</option>
          </select>

          <select id="categoryFilter" class="chip-select" aria-label="美食類別">
            <option value="all">🍽️ 全部</option>
            <option value="restaurant">🍜 餐廳</option>
            <option value="cafe">☕ 咖啡</option>
            <option value="fast_food">🍔 速食</option>
            <option value="bakery">🥐 烘焙</option>
            <option value="drink">🧋 飲品</option>
          </select>

          <select id="sortBy" class="chip-select" aria-label="排序方式">
            <option value="distance" selected>📍 最近優先</option>
            <option value="closing_late">🌙 最晚打烊</option>
            <option value="closing_soon">⏳ 即將打烊</option>
            <option value="rating">★ 評分最高</option>
            <option value="name">🔤 店名</option>
          </select>

          <!-- 價位上限 -->
          <select id="priceFilter" class="chip-select" aria-label="價位上限">
            <option value="all">💰 全部價位</option>
            <option value="1">💲 平價以下</option>
            <option value="2">💲💲 中價以下</option>
            <option value="3">💲💲💲 高價以下</option>
          </select>

          <label class="chip-toggle" title="只顯示營業中店家">
            <input type="checkbox" id="openOnlyToggle" checked>
            <span class="chip-toggle-inner">
              <span class="chip-dot"></span>
              <span>營業中</span>
            </span>
          </label>
        </div>
      </section>

      <!-- 位置顯示（手機版，在清單面板內） -->
      <div class="mobile-location-bar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="mobileLocationText">正在獲取 GPS 定位...</span>
      </div>

      <!-- 統計數據 -->
      <div class="list-header">
        <div class="list-count">
          搜尋結果：<span class="list-count-badge" id="placesCount">載入中...</span>
        </div>
        <button id="btnRandomPick" class="btn-random-mini" title="讓命運決定今天吃什麼">
          🎲 今天吃什麼？
        </button>
      </div>

      <!-- 店家清單列表 -->
      <section class="places-list" id="placesList" aria-label="美食店家列表">
        <!-- 由 JavaScript 動態渲染 -->
      </section>
    </aside>

    <!-- 地圖視圖區域 -->
    <section class="map-view-container" id="panelMap" aria-label="周遭美食地圖">
      <div id="map"></div>

      <!-- 地圖懸浮按鈕 -->
      <div class="map-fab-container">
        <button id="btnRandomPickMap" class="fab-btn btn-spin-wheel" title="讓命運決定今天吃什麼">
          🎲 今天吃什麼？
        </button>
      </div>
    </section>

  </main>

  <!-- 隨機挑選 Modal -->
  <div id="randomModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="randomModalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="randomModalTitle">🎲 隨機美食推薦</h3>
        <button id="randomModalClose" class="modal-close-btn" aria-label="關閉">&#x2715;</button>
      </div>
      <div class="modal-body" id="randomPickResult">
        <!-- 動態渲染隨機抽籤結果 -->
      </div>
      <div class="modal-footer">
        <button id="btnSpinAgain" class="btn-spin-again">再抽一次 🔄</button>
      </div>
    </div>
  </div>

  <!-- 自訂位置 Modal -->
  <div id="customLocationModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="customLocationTitle">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h3 id="customLocationTitle">📌 自訂搜尋位置</h3>
        <button id="customLocationClose" class="modal-close-btn" aria-label="關閉">&#x2715;</button>
      </div>
      <div class="modal-body">
        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:1rem;line-height:1.55;">
          輸入地址、地名或座標，搜尋指定位置周遭的店家。
        </p>
        <!-- 地址搜尋 -->
        <div class="location-search-group">
          <div class="search-input-wrapper">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="customLocationInput" class="search-input" placeholder="例：台北車站、東區美食、25.047, 121.517" autocomplete="off">
          </div>
          <button id="btnSearchLocation" class="btn-search-location">搜尋</button>
        </div>
        <!-- 搜尋結果 -->
        <div id="locationSearchResult" class="location-search-result" style="display:none;"></div>
        <!-- 目前自訂位置顯示 -->
        <div id="currentCustomLocationInfo" class="current-custom-info" style="display:none;"></div>
      </div>
      <div class="modal-footer" style="justify-content: space-between;">
        <button id="btnClearCustomLocation" class="btn-clear-location">↺ 回到 GPS 位置</button>
        <button id="btnConfirmLocation" class="btn-spin-again" disabled>確認使用此位置</button>
      </div>
    </div>
  </div>

  <!-- 浮動 Toast 訊息容器 -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
